# Window effect
blur=0
shadows=0
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=0
layer_animations=0

# Scroller Layout
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
scroller_proportion_preset=0.5,0.8,1.0

# Layout cycle
circle_layout=tile,vertical_tile,grid,monocle

# Master-Stack Layout
new_is_master=0
default_mfact=0.50
default_nmaster=1
smartgaps=0

# Overview
hotarea_size=0
enable_hotarea=0

# Misc
sloppyfocus=0
warpcursor=0
cursor_size=32
focus_on_activate=0

# Keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us

# Trackpad
tap_to_click=0
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
accel_speed=-0.2

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
borderpx=0
rootcolor=0x000000ff
bordercolor=0x000000ff
focuscolor=0x000000ff

monitorrule=name:^eDP-1$,scale:2.5
monitorrule=name:^DP-2$,scale:2

# Tag layouts
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:monocle
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Reload config
bind=ALT+CTRL,r,reload_config

# Spawn
bind=ALT,p,spawn,rofi -show drun
bind=ALT,Return,spawn,alacritty

# Kill / Quit
bind=ALT+SHIFT,c,killclient,
bind=ALT+SHIFT,q,quit

# Focus
bind=ALT,h,focusdir,left
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,l,focusdir,right
bind=ALT,Tab,focusstack,1
bind=ALT+SHIFT,Tab,focusstack,-1

# Swap windows
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,l,exchange_client,right

# Window state
bind=ALT,f,togglefullscreen
bind=ALT+CTRL,space,togglefloating,
bind=ALT,m,togglemaximizescreen,
bind=ALT,n,minimized,
bind=ALT+CTRL,n,restore_minimized
bind=ALT+CTRL,Return,zoom

# Layout
bind=ALT,space,switch_layout
bind=ALT,Left,setmfact,-0.05
bind=ALT,Right,setmfact,0.05
bind=ALT+CTRL,h,incnmaster,1
bind=ALT+CTRL,l,incnmaster,-1

# Tag switch (1-indexed, with monitor param)
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# Move window to tag
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# Toggle tag view
bind=ALT+CTRL,1,toggleview,1,0
bind=ALT+CTRL,2,toggleview,2,0
bind=ALT+CTRL,3,toggleview,3,0
bind=ALT+CTRL,4,toggleview,4,0
bind=ALT+CTRL,5,toggleview,5,0
bind=ALT+CTRL,6,toggleview,6,0
bind=ALT+CTRL,7,toggleview,7,0
bind=ALT+CTRL,8,toggleview,8,0
bind=ALT+CTRL,9,toggleview,9,0

# Navigate tags
bind=ALT+SUPER,h,viewtoleft,0
bind=ALT+SUPER,l,viewtoright,0

# Focus monitor
bind=ALT+CTRL,j,focusmon,left
bind=ALT+CTRL,k,focusmon,right

# Overview
bind=ALT,o,toggleoverview,

# Toggle waybar
bind=ALT,b,spawn,pkill --signal USR1 waybar

# Lock screen
bind=ALT+CTRL,s,spawn,/home/jibi/bin/lock

# Mouse
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# Volume/Brightness (Wayland needs these in the compositor)
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +2500
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -2500
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s '+5%'
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s '5%-'

# Autostart
exec-once=waybar
exec-once=nm-applet
exec-once=blueman-applet
